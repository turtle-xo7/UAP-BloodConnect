databases:
  - name: bloodconnect-db
    plan: free
    databaseName: bloodconnect
    user: bloodconnect

services:
  - type: web
    name: uap-bloodconnect
    runtime: python
    plan: free
    region: oregon
    buildCommand: "./build.sh"
    startCommand: "gunicorn bloodconnect.wsgi --bind 0.0.0.0:$PORT --workers 2 --timeout 60"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: bloodconnect-db
          property: connectionString
      - key: WEB_CONCURRENCY
        value: "2"
